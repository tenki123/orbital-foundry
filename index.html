<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Foundry — Layout preview</title>
<style>
body{font:16px system-ui,sans-serif;background:#111822;color:#edf2f7;max-width:50rem;margin:10vh auto;padding:0 1rem}
.eyebrow{color:#96b9cc;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
h1{font-size:clamp(2rem,7vw,4rem);margin:.3em 0}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.45rem;margin:2rem 0}
button{min-height:4rem;background:#23354a;color:inherit;border:1px solid #556e87;border-radius:.35rem;font:inherit;cursor:pointer}
button[aria-pressed="true"]{border:2px solid #82e4be;background:#1c453f}
#details{min-height:3em}small{color:#a6b3c1}
</style>
<main>
<p class="eyebrow">Outpost 01 / Layout preview</p>
<h1>Orbital Foundry</h1>
<p>First contract: ship 12 alloy plates.</p>
<section class="board" aria-label="Starter production line">
<button type="button" aria-pressed="true" data-description="Asteroid ore feeds the drill.">Ore deposit</button>
<button type="button" aria-pressed="false" data-description="Planned output: 1 ore per tick if the output has room.">Drill</button>
<button type="button" aria-pressed="false" data-description="Planned route: moves ore east to the smelter.">Belt →</button>
<button type="button" aria-pressed="false" data-description="Planned recipe: 2 ore to 1 alloy plate.">Smelter</button>
<button type="button" aria-pressed="false" data-description="Planned route: moves alloy plates east to cargo.">Belt →</button>
<button type="button" aria-pressed="false" data-description="Planned objective: ship 12 alloy plates.">Cargo pad</button>
</section>
<p id="details" aria-live="polite">Asteroid ore feeds the drill.</p>
<small>Design mockup. No resource or belt simulation yet.</small>
</main>
<script>
const tiles = document.querySelectorAll('.board button');
for (const tile of tiles) {
  tile.addEventListener('click', () => {
    for (const button of tiles) button.setAttribute('aria-pressed', String(button === tile));
    document.querySelector('#details').textContent = tile.dataset.description;
  });
}
</script>
</html>
